<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공식 축구 라인업 생성기</title>
  <!-- HTML을 이미지로 전환해주는 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      background-color: #0d0d11;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    /* 전체 레이아웃 */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      width: 100%;
      max-width: 1200px;
    }

    @media (min-width: 1024px) {
      .container {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    /* 컨트롤 패널 */
    .control-panel {
      width: 100%;
      max-width: 420px;
      background: #16161d;
      border: 1px solid #2a2a35;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-panel h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ff3344;
      border-bottom: 1px solid #2a2a35;
      padding-bottom: 12px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ff8894;
      margin-top: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: #a0a0ab;
      font-weight: 600;
    }

    .input-group input, .input-group select {
      background: #20202a;
      border: 1px solid #323242;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: #ff3344;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-sub {
      flex: 1;
      background: #2a2a38;
      color: #ffffff;
      border: 1px solid #3a3a4c;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sub:hover {
      background: #3a3a4c;
    }

    .btn-download {
      background: linear-gradient(135deg, #e60023, #990014);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background: linear-gradient(135deg, #ff1a35, #b30018);
    }

    /* 프리뷰 컨테이너 (스케일링 제어) */
    .preview-wrapper {
      width: 100%;
      max-width: 500px;
      container-type: inline-size;
      display: flex;
      justify-content: center;
    }

    /* 1. 기본 그래픽 모드 */
    .pitch-card {
      width: 100%;
      aspect-ratio: 4 / 6.5;
      background: linear-gradient(180deg, #180305 0%, #0a0102 50%, #000000 100%);
      border-radius: 4cqw;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 0.4cqw solid #2a080c;
      transition: all 0.3s ease;
    }

    /* 피트 라인 그래픽 */
    .pitch-graphics {
      position: absolute;
      inset: 0;
      opacity: 0.2;
      pointer-events: none;
    }

    .pitch-line {
      position: absolute;
      border: 0.3cqw solid #ffffff;
    }

    .pitch-outline {
      inset: 3cqw;
      border-radius: 2cqw;
    }

    .pitch-center-line {
      top: 50%; left: 3cqw; right: 3cqw;
      height: 0;
      border-top: 0.4cqw dashed #ff3344;
    }

    .pitch-center-circle {
      top: 50%; left: 50%;
      width: 20cqw; height: 20cqw;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    /* 상단 헤더 */
    .card-header {
      position: relative;
      z-index: 2;
      padding: 4cqw 3cqw 1cqw;
      text-align: center;
    }

    .team-title {
      font-size: 5cqw;
      font-weight: 900;
      letter-spacing: -0.1cqw;
      color: #ffffff;
    }

    .match-info {
      font-size: 2.2cqw;
      color: #ff3344;
      font-weight: 800;
      letter-spacing: 0.3cqw;
      margin-top: 0.5cqw;
    }

    /* 메인 경기장 레이아웃 */
    .pitch-body {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2cqw;
    }

    /* 하프 섹션 */
    .half-section {
      height: 50%;
      display: flex;
      flex-direction: column;
      position: relative;
      box-sizing: border-box;
    }

    /* 후반전 영역 */
    .half-section.second-half {
      justify-content: flex-start;
      gap: 1cqw;
      padding-top: 3.5cqw; /* 살짝 위로 당김 */
      padding-bottom: 2cqw;
    }

    /* 전반전 영역 */
    .half-section.first-half {
      justify-content: space-around;
      padding-top: 2cqw;
    }

    /* 전/후반 배지 */
    .half-badge {
      position: absolute;
      right: 1.5cqw;
      background: #ff3344;
      color: #ffffff;
      font-size: 1.8cqw;
      font-weight: 900;
      padding: 0.4cqw 1.5cqw;
      border-radius: 1cqw;
      pointer-events: none;
      z-index: 3;
    }

    .half-section.second-half .half-badge { top: 0; }
    .half-section.first-half .half-badge { bottom: 0; }

    .row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
    }

    /* 선수 카드 */
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 15cqw;
    }

    /* 번호 배지 */
    .badge {
      width: 7.2cqw;
      height: 7.2cqw;
      background: linear-gradient(135deg, #cc001b, #7a000e);
      border: 0.2cqw solid rgba(255, 255, 255, 0.3);
      border-radius: 1.6cqw;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Teko', sans-serif;
      font-weight: 700;
      font-size: 4cqw;
      color: #ffffff;
      margin-bottom: 0.8cqw;
      outline: none;
    }

    .gk .badge {
      background: #25252e;
      border-color: #555566;
      color: #ff3344;
    }

    /* 평행사변형 이름 박스 */
    .player-name-box {
      background: #ffffff;
      padding: 0.4cqw 1.2cqw;
      transform: skewX(-12deg);
      border-radius: 0.4cqw;
      width: 100%;
      text-align: center;
    }

    .player-name {
      transform: skewX(12deg);
      font-size: 2.1cqw;
      font-weight: 800;
      color: #000000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      outline: none;
    }

    /* 하단 푸터 */
    .card-footer {
      position: relative;
      z-index: 2;
      padding: 0 3cqw 3cqw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 2cqw;
      color: #888899;
      font-weight: 700;
    }

    .logo-tag { color: #ff3344; }

    /* ===== 드래그로 선수 자리 교체 ===== */
    .player-card {
      touch-action: none;
      cursor: grab;
      -webkit-touch-callout: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .player-card.pressing { transform: scale(0.92); }
    .player-card.drag-source { opacity: 0.25; }
    .player-card.drop-target { transform: scale(1.08); }
    .player-card.drop-target .badge { box-shadow: 0 0 0 0.6cqw #ffd54a; }

    .player-card.drag-ghost {
      position: absolute;
      z-index: 20;
      margin: 0;
      pointer-events: none;
      transform: scale(1.15);
      opacity: 0.96;
      transition: none;
      filter: drop-shadow(0 1.5cqw 2cqw rgba(0, 0, 0, 0.6));
    }

    body.dragging-player,
    body.dragging-player * {
      user-select: none;
      -webkit-user-select: none;
      cursor: grabbing !important;
    }

    .drag-hint {
      font-size: 0.78rem;
      color: #8a8a99;
      line-height: 1.5;
    }

    /* 2. A4 문서 모드 (A4 맞춤 세부 조정) */
    .pitch-card.doc-mode {
      background: #ffffff !important;
      border: 0.4cqw solid #cccccc !important;
      color: #000000 !important;
      aspect-ratio: 1 / 1.414;
    }

    /* A4 모드 전용 후반전 미세 위쪽 위치 조정 */
    .pitch-card.doc-mode .half-section.second-half {
      padding-top: 1.8cqw; /* A4 모드에서 후반 라인업을 약간 더 위로 올림 */
      gap: 0.8cqw;
    }

    .pitch-card.doc-mode .pitch-graphics { opacity: 1; }
    .pitch-card.doc-mode .pitch-line { border-color: #aaaaaa; }
    .pitch-card.doc-mode .pitch-center-line { border-top: 0.3cqw dashed #888888; }
    .pitch-card.doc-mode .team-title { color: #000000; }
    .pitch-card.doc-mode .match-info { color: #555555; }
    .pitch-card.doc-mode .half-badge { background: #555555; color: #ffffff; }
    .pitch-card.doc-mode .badge { background: #ffffff; border: 0.3cqw solid #333333; color: #000000; }
    .pitch-card.doc-mode .gk .badge { background: #e0e0e0; border-color: #000000; color: #000000; }
    .pitch-card.doc-mode .player-name-box { background: #f0f0f0; border: 0.2cqw solid #cccccc; }
    .pitch-card.doc-mode .player-name { color: #000000; }
    .pitch-card.doc-mode .card-footer { color: #666666; }
    .pitch-card.doc-mode .logo-tag { color: #333333; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 컨트롤 패널 -->
    <div class="control-panel">
      <h2>라인업 설정</h2>

      <div class="input-group">
        <label for="modeSelect">출력 모드 선택</label>
        <select id="modeSelect" onchange="onModeChange()">
          <option value="graphic">그래픽 모드 (디지털 테마)</option>
          <option value="doc">A4 문서 모드 (회색 선/출력용)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="teamNameInput">팀 이름</label>
        <input type="text" id="teamNameInput" value="맨체스터 유나이티드" oninput="onDataChange()">
      </div>

      <div class="input-group">
        <label for="matchInfoInput">경기 정보</label>
        <input type="text" id="matchInfoInput" value="1라운드 • 전/후반 통합 명단" oninput="onDataChange()">
      </div>

      <div class="section-title">후반전 포메이션 (위쪽 영역)</div>
      <div class="input-group">
        <label for="formation2ndInput">포메이션 (예: 6-2-2, 4-3-3)</label>
        <input type="text" id="formation2ndInput" value="4-3-3" oninput="onDataChange()">
      </div>

      <div class="section-title">전반전 포메이션 (아래쪽 영역)</div>
      <div class="input-group">
        <label for="formation1stInput">포메이션 (예: 1-7-1-1, 4-2-3-1)</label>
        <input type="text" id="formation1stInput" value="4-2-3-1" oninput="onDataChange()">
      </div>

      <!-- 내보내기 및 불러오기 버튼 -->
      <div class="btn-group">
        <button class="btn-sub" onclick="exportConfig()">💾 설정 내보내기</button>
        <button class="btn-sub" onclick="document.getElementById('importFileInput').click()">📂 설정 불러오기</button>
        <input type="file" id="importFileInput" style="display:none;" accept=".json" onchange="importConfig(event)">
      </div>

      <div class="drag-hint">💡 선수를 꾹 누른 채 다른 선수 위로 드래그하면 이름과 번호가 통째로 서로 교체돼요. (전/후반 사이, 골키퍼도 가능)</div>

      <button class="btn-download" onclick="downloadLineup()">이미지로 저장하기</button>
    </div>

    <!-- 라인업 그래픽 카드 -->
    <div class="preview-wrapper">
      <div class="pitch-card" id="lineupCard">
        <!-- 필드 그래픽 -->
        <div class="pitch-graphics">
          <div class="pitch-line pitch-outline"></div>
          <div class="pitch-line pitch-center-line"></div>
          <div class="pitch-line pitch-center-circle"></div>
        </div>

        <!-- 상단 헤더 -->
        <div class="card-header">
          <div class="team-title" id="displayTeamName">맨체스터 유나이티드</div>
          <div class="match-info" id="displayMatchInfo">1라운드 • 전/후반 통합 명단</div>
        </div>

        <!-- 필드 레이아웃 -->
        <div class="pitch-body">
          <!-- 후반전 (상단) -->
          <div class="half-section second-half" id="grid2nd">
            <div class="half-badge">후반전</div>
          </div>

          <!-- 전반전 (하단) -->
          <div class="half-section first-half" id="grid1st">
            <div class="half-badge">전반전</div>
          </div>
        </div>

        <!-- 하단 푸터 -->
        <div class="card-footer">
          <span class="logo-tag">공식 라인업</span>
          <span>선발 및 교체 명단</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'lineupConfig';

    const koreanNames = [
      '래시포드', '호일룬', '가르나초', '페르난데스', '카세미루',
      '마이누', '쇼', '마르티네스', '바란', '달롯', '오나나',
      '안토니', '에릭센', '마운트', '린델뢰프', '매과이어', '에반스'
    ];

    /*
      선수 데이터 저장 구조
      players.second / players.first = { gk: {num, name}, field: [{num, name}, ...] }
      - field 는 "선수 풀"입니다. 포메이션이 바뀌면 앞에서부터 순서대로 새 배치에 채워지고,
        포메이션 인원이 줄어도 풀은 잘리지 않아서 다시 늘리면 원래 선수가 복원됩니다.
    */
    function defaultGK(half) {
      return half === 'second' ? { num: '1', name: '골키퍼' } : { num: '24', name: '오나나' };
    }

    function defaultField(i) {
      return { num: String((i % 99) + 2), name: koreanNames[i % koreanNames.length] };
    }

    function emptyPlayers() {
      return {
        second: { gk: defaultGK('second'), field: [] },
        first: { gk: defaultGK('first'), field: [] }
      };
    }

    let players = emptyPlayers();

    function normalizePlayers(p) {
      const result = emptyPlayers();
      if (!p || typeof p !== 'object') return result;
      ['second', 'first'].forEach(half => {
        const src = p[half];
        if (!src) return;
        if (src.gk && typeof src.gk === 'object') {
          result[half].gk = {
            num: String(src.gk.num ?? result[half].gk.num),
            name: String(src.gk.name ?? result[half].gk.name)
          };
        }
        if (Array.isArray(src.field)) {
          result[half].field = src.field.map((f, i) => {
            const d = defaultField(i);
            return {
              num: String((f && f.num) ?? d.num),
              name: String((f && f.name) ?? d.name)
            };
          });
        }
      });
      return result;
    }

    function getFieldPlayer(half, i) {
      return players[half].field[i] || defaultField(i);
    }

    function setPlayerProp(half, kind, idx, prop, value) {
      const h = players[half];
      if (kind === 'gk') {
        h.gk[prop] = value;
      } else {
        while (h.field.length <= idx) h.field.push(defaultField(h.field.length));
        h.field[idx][prop] = value;
      }
    }

    function parseFormation(str) {
      const nums = str.split('-')
        .map(n => parseInt(n.trim()))
        .filter(n => !isNaN(n) && n > 0)
        .map(n => Math.min(n, 11));
      return nums.length > 0 ? nums : [4, 3, 3];
    }

    function updateHeader() {
      document.getElementById('displayTeamName').innerText = document.getElementById('teamNameInput').value || '팀 이름';
      document.getElementById('displayMatchInfo').innerText = document.getElementById('matchInfoInput').value || '경기 정보';
    }

    function toggleMode() {
      const mode = document.getElementById('modeSelect').value;
      const card = document.getElementById('lineupCard');
      card.classList.toggle('doc-mode', mode === 'doc');
    }

    function onModeChange() {
      toggleMode();
      saveToLocalStorage();
    }

    // 한 하프의 줄(row) 구성 — 선수 데이터는 풀에서 가져옴
    function buildRows(half, formationStr) {
      const counts = parseFormation(formationStr);
      const rows = [];
      let idx = 0;

      counts.forEach(count => {
        const rowData = [];
        for (let i = 0; i < count; i++) {
          const p = getFieldPlayer(half, idx);
          rowData.push({ kind: 'field', idx: idx, num: p.num, name: p.name });
          idx++;
        }
        rows.push(rowData);
      });

      const gk = players[half].gk;
      const gkRow = [{ kind: 'gk', idx: 0, num: gk.num, name: gk.name }];

      // 후반전(위쪽)은 골키퍼가 맨 위, 전반전(아래쪽)은 맨 아래
      if (half === 'second') rows.unshift(gkRow);
      else rows.push(gkRow);

      return rows;
    }

    function buildHalfGrid(elementId, half, formationStr) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';

      const badge = document.createElement('div');
      badge.className = 'half-badge';
      badge.textContent = half === 'second' ? '후반전' : '전반전';
      container.appendChild(badge);

      buildRows(half, formationStr).forEach(rowData => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row';

        rowData.forEach(player => {
          const card = document.createElement('div');
          card.className = 'player-card' + (player.kind === 'gk' ? ' gk' : '');
          card.dataset.half = half;
          card.dataset.kind = player.kind;
          card.dataset.idx = player.idx;

          const numEl = document.createElement('div');
          numEl.className = 'badge';
          numEl.contentEditable = 'true';
          numEl.spellcheck = false;
          numEl.dataset.prop = 'num';
          numEl.textContent = player.num;

          const nameBox = document.createElement('div');
          nameBox.className = 'player-name-box';
          const nameEl = document.createElement('span');
          nameEl.className = 'player-name';
          nameEl.contentEditable = 'true';
          nameEl.spellcheck = false;
          nameEl.dataset.prop = 'name';
          nameEl.textContent = player.name;
          nameBox.appendChild(nameEl);

          card.appendChild(numEl);
          card.appendChild(nameBox);
          rowDiv.appendChild(card);
        });

        container.appendChild(rowDiv);
      });
    }

    function renderAllFormations() {
      buildHalfGrid('grid2nd', 'second', document.getElementById('formation2ndInput').value);
      buildHalfGrid('grid1st', 'first', document.getElementById('formation1stInput').value);
    }

    function onDataChange() {
      updateHeader();
      renderAllFormations();
      saveToLocalStorage();
    }

    /* ---------- 선수 이름/번호 직접 수정 → 즉시 저장 ---------- */
    (function setupLiveEditing() {
      const card = document.getElementById('lineupCard');

      card.addEventListener('input', e => {
        const el = e.target;
        if (!el.dataset || !el.dataset.prop) return;
        const playerCard = el.closest('.player-card');
        if (!playerCard) return;

        setPlayerProp(
          playerCard.dataset.half,
          playerCard.dataset.kind,
          parseInt(playerCard.dataset.idx),
          el.dataset.prop,
          el.textContent
        );
        saveToLocalStorage(); // 입력하는 즉시 저장 (다시 그리지 않으므로 커서 유지)
      });

      // 엔터로 줄바꿈 방지
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.dataset && e.target.dataset.prop) {
          e.preventDefault();
          e.target.blur();
        }
      });

      // 붙여넣기는 일반 텍스트로만
      card.addEventListener('paste', e => {
        if (e.target.dataset && e.target.dataset.prop) {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g, ' ');
          document.execCommand('insertText', false, text);
        }
      });
    })();

    /* ---------- 꾹 눌러 드래그해서 선수 교체 ---------- */
    (function setupDragSwap() {
      const HOLD_MS = 350;   // 이만큼 누르고 있으면 드래그 시작
      const MOVE_TOL = 10;   // 누르는 동안 이 이상 움직이면 취소(텍스트 선택 등 기본 동작 유지)
      const cardEl = document.getElementById('lineupCard');

      let press = null;
      let drag = null;
      let lastX = 0, lastY = 0;

      function slotOf(pc) {
        return { half: pc.dataset.half, kind: pc.dataset.kind, idx: parseInt(pc.dataset.idx) };
      }

      function findCard(s) {
        return cardEl.querySelector(
          `.player-card:not(.drag-ghost)[data-half="${s.half}"][data-kind="${s.kind}"][data-idx="${s.idx}"]`
        );
      }

      function getPlayer(s) {
        const p = s.kind === 'gk' ? players[s.half].gk : getFieldPlayer(s.half, s.idx);
        return { num: p.num, name: p.name };
      }

      function cancelPress() {
        if (!press) return;
        clearTimeout(press.holdTimer);
        clearTimeout(press.visTimer);
        press.card.classList.remove('pressing');
        press = null;
      }

      cardEl.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (press || drag) return;
        const pc = e.target.closest('.player-card');
        if (!pc) return;

        // 이미 글자를 편집 중인 칸에서는 드래그 대신 일반 텍스트 조작 허용
        const editable = e.target.closest('[contenteditable]');
        if (editable && document.activeElement === editable) return;

        lastX = e.clientX; lastY = e.clientY;
        press = {
          card: pc,
          startX: e.clientX,
          startY: e.clientY,
          visTimer: setTimeout(() => pc.classList.add('pressing'), 130),
          holdTimer: setTimeout(startDrag, HOLD_MS)
        };
      });

      function startDrag() {
        if (!press) return;
        const pc = press.card;
        const slot = slotOf(pc);
        clearTimeout(press.visTimer);
        pc.classList.remove('pressing');
        press = null;

        // 편집 포커스/선택 해제
        const ae = document.activeElement;
        if (ae && ae !== document.body && ae.blur) ae.blur();
        const sel = window.getSelection();
        if (sel) sel.removeAllRanges();

        const rect = pc.getBoundingClientRect();
        const ghost = pc.cloneNode(true);
        ghost.classList.add('drag-ghost');
        ghost.querySelectorAll('[contenteditable]').forEach(n => n.removeAttribute('contenteditable'));
        ghost.style.width = rect.width + 'px';
        cardEl.appendChild(ghost);

        pc.classList.add('drag-source');
        document.body.classList.add('dragging-player');

        drag = { card: pc, slot, ghost, w: rect.width, h: rect.height, target: null };
        moveGhost(lastX, lastY);
        updateTarget(lastX, lastY);

        if (navigator.vibrate) navigator.vibrate(15);
      }

      function moveGhost(x, y) {
        const cr = cardEl.getBoundingClientRect();
        drag.ghost.style.left = (x - cr.left - cardEl.clientLeft - drag.w / 2) + 'px';
        drag.ghost.style.top = (y - cr.top - cardEl.clientTop - drag.h / 2) + 'px';
      }

      // 포인터와 가장 가까운 다른 선수 칸을 교체 대상으로 선택
      function updateTarget(x, y) {
        const sr = drag.card.getBoundingClientRect();
        const selfDist = Math.hypot(x - (sr.left + sr.width / 2), y - (sr.top + sr.height / 2));

        let best = null, bestD = Infinity;
        cardEl.querySelectorAll('.player-card:not(.drag-ghost)').forEach(c => {
          if (c === drag.card) return;
          const r = c.getBoundingClientRect();
          const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
          if (d < bestD) { bestD = d; best = c; }
        });

        const next = (best && bestD < drag.w * 0.9 && bestD < selfDist) ? best : null;
        if (next !== drag.target) {
          if (drag.target) drag.target.classList.remove('drop-target');
          if (next) next.classList.add('drop-target');
          drag.target = next;
        }
      }

      // FLIP 애니메이션: 이전 위치에서 현재 위치로 부드럽게 이동
      function animateFrom(el, fromRect, scale) {
        if (!el) return;
        const to = el.getBoundingClientRect();
        const dx = (fromRect.left + fromRect.width / 2) - (to.left + to.width / 2);
        const dy = (fromRect.top + fromRect.height / 2) - (to.top + to.height / 2);

        el.style.transition = 'none';
        el.style.position = 'relative';
        el.style.zIndex = '5';
        el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
        void el.offsetWidth; // 리플로우 강제

        el.style.transition = 'transform 400ms cubic-bezier(0.2, 0.8, 0.2, 1)';
        el.style.transform = '';
        setTimeout(() => {
          el.style.transition = '';
          el.style.position = '';
          el.style.zIndex = '';
          el.style.transform = '';
        }, 430);
      }

      function endDrag(commit) {
        const d = drag;
        drag = null;
        document.body.classList.remove('dragging-player');
        if (d.target) d.target.classList.remove('drop-target');

        if (commit && d.target) {
          const sA = d.slot;
          const sB = slotOf(d.target);
          const ghostRect = d.ghost.getBoundingClientRect();
          const rectB = d.target.getBoundingClientRect();

          // 이름 + 번호 통째로 교체
          const pa = getPlayer(sA);
          const pb = getPlayer(sB);
          setPlayerProp(sA.half, sA.kind, sA.idx, 'num', pb.num);
          setPlayerProp(sA.half, sA.kind, sA.idx, 'name', pb.name);
          setPlayerProp(sB.half, sB.kind, sB.idx, 'num', pa.num);
          setPlayerProp(sB.half, sB.kind, sB.idx, 'name', pa.name);

          d.ghost.remove();
          renderAllFormations();
          saveToLocalStorage();

          // 드래그한 선수는 손을 뗀 위치에서 → 새 자리로, 상대 선수는 자기 자리 → 내 자리로
          animateFrom(findCard(sB), ghostRect, 1.15);
          animateFrom(findCard(sA), rectB, 1);
        } else {
          // 교체 대상이 없으면 원래 자리로 되돌아가기
          const cr = cardEl.getBoundingClientRect();
          const r = d.card.getBoundingClientRect();
          d.ghost.style.transition = 'left 0.25s ease, top 0.25s ease, transform 0.25s ease';
          d.ghost.style.left = (r.left - cr.left - cardEl.clientLeft) + 'px';
          d.ghost.style.top = (r.top - cr.top - cardEl.clientTop) + 'px';
          d.ghost.style.transform = 'scale(1)';
          setTimeout(() => {
            d.ghost.remove();
            d.card.classList.remove('drag-source');
          }, 270);
        }
      }

      window.addEventListener('pointermove', e => {
        lastX = e.clientX; lastY = e.clientY;
        if (press) {
          if (Math.hypot(e.clientX - press.startX, e.clientY - press.startY) > MOVE_TOL) cancelPress();
        } else if (drag) {
          e.preventDefault();
          moveGhost(e.clientX, e.clientY);
          updateTarget(e.clientX, e.clientY);
        }
      }, { passive: false });

      window.addEventListener('pointerup', () => {
        if (press) cancelPress();
        else if (drag) endDrag(true);
      });

      window.addEventListener('pointercancel', () => {
        if (press) cancelPress();
        else if (drag) endDrag(false);
      });

      // 드래그 중 화면 스크롤/텍스트 선택/길게 누르기 메뉴 방지
      window.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
      document.addEventListener('selectstart', e => { if (drag) e.preventDefault(); });
      cardEl.addEventListener('contextmenu', e => { if (press || drag) e.preventDefault(); });
    })();

    /* ---------- 저장 / 불러오기 ---------- */
    function collectState() {
      return {
        teamName: document.getElementById('teamNameInput').value,
        matchInfo: document.getElementById('matchInfoInput').value,
        formation2nd: document.getElementById('formation2ndInput').value,
        formation1st: document.getElementById('formation1stInput').value,
        mode: document.getElementById('modeSelect').value,
        players: players
      };
    }

    function applyState(data) {
      if (data.teamName !== undefined) document.getElementById('teamNameInput').value = data.teamName;
      if (data.matchInfo !== undefined) document.getElementById('matchInfoInput').value = data.matchInfo;
      if (data.formation2nd !== undefined) document.getElementById('formation2ndInput').value = data.formation2nd;
      if (data.formation1st !== undefined) document.getElementById('formation1stInput').value = data.formation1st;
      if (data.mode) document.getElementById('modeSelect').value = data.mode;
      players = normalizePlayers(data.players);
      toggleMode();
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState()));
      } catch (e) {}
    }

    function loadFromLocalStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) applyState(JSON.parse(saved));
      } catch (e) {}
    }

    function exportConfig() {
      const data = collectState();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${data.teamName || '라인업'}_설정.json`;
      link.click();
    }

    function importConfig(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = JSON.parse(e.target.result);
          applyState(data);
          onDataChange();
        } catch (err) {
          alert('올바른 설정 파일이 아닙니다.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function downloadLineup() {
      const card = document.getElementById('lineupCard');

      html2canvas(card, {
        scale: 3,
        backgroundColor: null,
        useCORS: true
      }).then(canvas => {
        const link = document.createElement('a');
        const teamName = document.getElementById('teamNameInput').value || '라인업';
        const mode = document.getElementById('modeSelect').value;
        link.download = `${teamName.replace(/\s+/g, '_')}_${mode === 'doc' ? 'A4문서' : '디지털'}_라인업.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // 초기화
    loadFromLocalStorage();
    onDataChange();
  </script>
</body>
</html>
